# ============================================================
# ci-python.yml — Python Continuous Integration Pipeline
# ============================================================
#
# ONLY runs when files inside cicd/CI/ are changed.
# Terraform changes will NOT trigger this workflow.
#
# ============================================================

name: Learn CI - Run Python Tests 🧪

on:
  push:
    branches:
      - main
    paths:
      - "cicd/CI/**"

  pull_request:
    branches:
      - main
    paths:
      - "cicd/CI/**"

  workflow_dispatch:

jobs:
  test:
    name: 🐍 Run Python Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: cicd/CI

    steps:
      - name: 📥 Step 1 - Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Step 2 - Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: cicd/CI/requirements.txt

      - name: 📦 Step 3 - Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Step 4 - Run tests
        run: |
          mkdir reports
          python -m pytest test_hello.py -v \
            --junitxml=reports/test-results.xml \
            --html=reports/test-report.html \
            --self-contained-html

      - name: 📊 Step 5 - Publish Test Summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Pytest Results
          path: cicd/CI/reports/test-results.xml
          reporter: java-junit

      - name: 📦 Step 6 - Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-reports
          path: cicd/CI/reports/
